apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
spec:
  selector:
    matchLabels:
      app: myapp-argocd
  replicas: 2
  template:
    metadata:
      labels:
        app: myapp-argocd
    spec:
      containers:
      - name: myapp-argocd
        image: nanajanashia/argocd-app:1.1
        ports:
        - containerPort: 8080
